# Modified for IntraPilot; see NOTICE. Fork Actions remains disabled.
name: Verify project foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify foundation only
        run: python scripts/verify-bootstrap.py
